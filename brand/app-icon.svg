<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="cursive">
  <title>cursive app icon</title>
  <defs>
    <linearGradient id="ai-tile" x1=".14" y1="0" x2=".86" y2="1">
      <stop offset="0" stop-color="#fbf9f5"/><stop offset=".5" stop-color="#efe9de"/><stop offset="1" stop-color="#d9d1c2"/></linearGradient>
    <radialGradient id="ai-sheen" cx=".24" cy=".1" r=".76">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ai-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#6f6656" stop-opacity=".3"/></linearGradient>
    <linearGradient id="ai-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c463e"/><stop offset="1" stop-color="#201e1b"/></linearGradient>
    <linearGradient id="ai-car" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#a8d6ff"/><stop offset=".42" stop-color="#3f93f2"/><stop offset="1" stop-color="#0f51ae"/></linearGradient>
    <radialGradient id="ai-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3d90f0" stop-opacity=".34"/><stop offset=".5" stop-color="#3d90f0" stop-opacity=".1"/><stop offset="1" stop-color="#3d90f0" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- Apple 的 macOS 图标网格：1024 画布里圆角矩形占 824，四周留透明边 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ai-tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ai-sheen)"/>
  <!-- C：一整笔，开口朝右。笔宽与标志里的正文胶囊同族，缺口正对光标 -->
  <path d="M 657 331 A 236 236 0 1 0 657 693" fill="none" stroke="url(#ai-ink)" stroke-width="106" stroke-linecap="round"/>
  <path d="M 600 290 A 236 236 0 0 0 330 430" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="9" stroke-linecap="round"/>
  <!-- 光标：正好停在 C 的缺口上 —— 写到哪儿，C 就断在哪儿 -->
  <ellipse cx="660" cy="512" rx="92" ry="112" fill="url(#ai-halo)"/>
  <rect x="634" y="424" width="52" height="176" rx="26" fill="url(#ai-car)"/>
  <rect x="645" y="438" width="14" height="120" rx="7" fill="#fff" opacity=".5"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="url(#ai-edge)" stroke-width="3"/>
</svg>
