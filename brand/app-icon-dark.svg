<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="cursive">
  <title>cursive app icon (dark)</title>
  <defs>
    <!-- macOS 的图标网格：1024 画布里瓷砖占 824，四周 100 留空。圆角是连续曲率的超椭圆
         （|u/r|^2.6 + |v/r|^2.6 = 1，r=266），逐像素量自系统图标遮罩，偏差 ≤1px —— 画得跟
         遮罩一样，macOS 26 把老式 .icns 往那个形状上裁时才什么都裁不掉。 -->
    <path id="aid-tile" d="M 366 100 H 658 C 711.3 100 800 100.5 861.8 162.2 C 923.5 224 924 312.7 924 366 V 658 C 924 711.3 923.5 800 861.8 861.8 C 800 923.5 711.3 924 658 924 H 366 C 312.7 924 224 923.5 162.2 861.8 C 100.5 800 100 711.3 100 658 V 366 C 100 312.7 100.5 224 162.2 162.2 C 224 100.5 312.7 100 366 100 Z"/>
    <clipPath id="aid-clip"><use href="#aid-tile"/></clipPath>
    <!-- 一整笔写出来的 c：入笔细、左侧下行最粗、收笔提细，末了带一小截出锋。
         外轮廓是变宽度笔画拟合的三次贝塞尔（偏差 ≤1.1px），字身右倾 5° 已烘进坐标。 -->
    <path id="aid-c" d="M 709.7 303 C 684.9 275 653.7 254.2 617.7 242.1 C 582.8 230.3 540.6 227 500.5 234.2 C 461.2 241.3 419.3 259.2 384.1 284.9 C 349.7 310.1 317.8 345.5 295.4 384.5 C 272.4 424.6 258.5 467.4 253.8 512 C 249.1 556.8 254.1 600.4 269.4 641.1 C 284.5 681.1 308.3 715.8 340.3 743.3 C 371.4 769.9 410.9 788.6 449.7 796 C 489.6 803.6 531.1 801 571.4 788.2 C 610.5 775.8 646.2 754.4 676.6 725.6 C 677 719.6 686.1 710 688.3 706.6 C 692.3 700.5 695.9 694.7 699.5 688.4 C 703.1 682.3 706.3 676.4 709.6 670.1 C 712.7 663.9 715.5 657.9 718.3 651.6 A 8 8 0 0 0 705.4 643.1 C 700.6 647.4 695.9 651.3 690.7 655.2 C 685.6 659 680.6 662.4 675.2 665.7 C 669.9 668.9 664.8 671.7 659.1 674.3 C 656.1 675.6 646.5 681.3 641.9 679.8 C 614.7 696.2 586.7 705.5 559.4 708.5 C 532.8 711.4 505.5 707.8 482.7 699.2 C 459.1 690.3 438.8 676.2 422 657.9 C 405.7 640 392.3 616.9 384.3 592 C 376.4 567.8 372.5 539.8 374.2 512 C 375.8 483.9 382.6 456.7 394.9 430.4 C 406.9 404.6 423.2 381.6 444.2 361.9 C 464.7 342.6 488.3 327.9 514.5 318.6 C 539.6 309.7 568.8 306 595.9 309.2 C 623.5 312.5 650.6 322.3 675.5 339.6 A 24 24 0 0 0 709.7 303 Z"/>
    <clipPath id="aid-cc"><use href="#aid-c"/></clipPath>
    <linearGradient id="aid-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3e"/><stop offset=".55" stop-color="#252528"/><stop offset="1" stop-color="#151517"/></linearGradient>
    <linearGradient id="aid-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
    <linearGradient id="aid-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe0e6"/></linearGradient>
    <linearGradient id="aid-car" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#a8d6ff"/><stop offset=".42" stop-color="#3f93f2"/><stop offset="1" stop-color="#0f51ae"/></linearGradient>
    <radialGradient id="aid-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3d90f0" stop-opacity=".34"/><stop offset=".5" stop-color="#3d90f0" stop-opacity=".1"/><stop offset="1" stop-color="#3d90f0" stop-opacity="0"/></radialGradient>
    <radialGradient id="aid-pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- 瓷砖底下不画落影：macOS 26 自己给图标上投影，并且把遮罩外的东西一律裁掉 -->
  <use href="#aid-tile" fill="url(#aid-face)"/>
  <g clip-path="url(#aid-clip)">
    <!-- 整块瓷砖就是那张纸，横格是纸本身，不是花纹 -->
    <rect x="168" y="190" width="688" height="7" rx="3.5" fill="#fff" opacity=".07"/>
    <rect x="168" y="320" width="688" height="7" rx="3.5" fill="#fff" opacity=".07"/>
    <rect x="168" y="450" width="688" height="7" rx="3.5" fill="#fff" opacity=".07"/>
    <rect x="168" y="580" width="688" height="7" rx="3.5" fill="#fff" opacity=".07"/>
    <rect x="168" y="710" width="688" height="7" rx="3.5" fill="#fff" opacity=".07"/>
    <rect x="168" y="840" width="688" height="7" rx="3.5" fill="#fff" opacity=".07"/>
    <!-- 墨洇进纸的纤维里：把轮廓描三道宽边，一半压在墨下，一半渗到纸上 -->
    <use href="#aid-c" fill="none" stroke="#fff" stroke-opacity=".02" stroke-width="42"/>
    <use href="#aid-c" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="24"/>
    <use href="#aid-c" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="11"/>
    <use href="#aid-c" fill="url(#aid-ink)"/>
    <!-- 落笔处、碗底转向处：笔一慢，墨就积得深一点 -->
    <g clip-path="url(#aid-cc)"><circle cx="693" cy="321" r="78" fill="url(#aid-pool)" opacity=".3"/><circle cx="517" cy="754" r="96" fill="url(#aid-pool)" opacity=".2"/></g>
    <!-- 光标：停在这一笔的末端 —— 写到哪儿，它就在哪儿 -->
    <ellipse cx="706" cy="512" rx="92" ry="112" fill="url(#aid-halo)"/>
    <rect x="680" y="424" width="52" height="176" rx="26" fill="url(#aid-car)"/>
    <rect x="691" y="438" width="14" height="120" rx="7" fill="#fff" opacity=".5"/>
  </g>
  <g clip-path="url(#aid-clip)"><use href="#aid-tile" fill="none" stroke="url(#aid-rim)" stroke-width="6"/></g>
</svg>
