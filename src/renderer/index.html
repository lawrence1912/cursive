<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: safe-file: http: https:; script-src 'self'"
    />
    <title>Cursive</title>
  </head>
  <body>
    <!-- 标题栏按钮的轨道：固定在窗口顶边、自己不吃事件（pointer-events:none），
         只把两端那几颗按钮钉在红绿灯那条线上。它不占位 —— 顶边那 38px 归 #topbar
         （中间列）与侧栏/大纲各自的顶部留白，正文的标签因此坐在窗口最上面 -->
    <div id="drag-strip"></div>
    <div id="main">
      <!-- #sidebar / #outline 由 main.ts 插到这里 -->
      <div id="center">
        <div id="topbar"><!-- #tabbar 由 main.ts 插到这里 --></div>
        <main id="editor-host"></main>
      </div>
    </div>
    <footer id="status-bar">
      <!-- status-file 的内容由 main.ts 启动时填（跟随界面语言），这里留空防错语闪帧 -->
      <span id="status-file"></span>
      <!-- 一次性反馈（链接打不开 / 没有这个锚点…）：main.ts 的 note() 写，4 秒后自己清空。
           aria-live 让读屏也念得到 —— 它是「刚才那一下没成」的唯一告知 -->
      <span id="status-note" role="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <span id="status-pos"></span>
      <span id="status-count" role="button" tabindex="0" data-i18n-title="status.detailTitle"></span>
      <span id="status-match"></span>
      <span id="status-saved"></span>
      <!-- 0.4.1 正文缩放：100% 时为空（CSS 里 :empty 整格不露面），缩着时点一下回到 100% -->
      <span id="status-zoom" role="button" tabindex="0" data-i18n-title="status.zoomTitle"></span>
      <!-- 第八节 5 只读：不只读时为空（:empty 不露面），只读时是一把锁 +「只读」，点一下退出 -->
      <span id="status-ro" role="button" tabindex="0" data-i18n-title="status.roTitle"></span>
      <span id="status-mode"></span>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
