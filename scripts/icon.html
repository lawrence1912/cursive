<!doctype html>
<meta charset="utf-8" />
<!-- build/icon.png 的设计源。矢量源是 brand/app-icon.svg，设计说明见 brand/README.md。
     导出：浏览器打开本文件截图 1024×1024（背景透明），存为 build/icon.png，再 `npm run icon`。 -->
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  svg { display: block; }
</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1=".14" y1="0" x2=".86" y2="1">
      <stop offset="0" stop-color="#fbf9f5"/><stop offset=".5" stop-color="#efe9de"/><stop offset="1" stop-color="#d9d1c2"/></linearGradient>
    <radialGradient id="sheen" cx=".24" cy=".1" r=".76">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#6f6656" stop-opacity=".3"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c463e"/><stop offset="1" stop-color="#201e1b"/></linearGradient>
    <linearGradient id="mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdb5a7"/><stop offset="1" stop-color="#948b7d"/></linearGradient>
    <linearGradient id="car" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#a8d6ff"/><stop offset=".42" stop-color="#3f93f2"/><stop offset="1" stop-color="#0f51ae"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3d90f0" stop-opacity=".34"/><stop offset=".5" stop-color="#3d90f0" stop-opacity=".1"/><stop offset="1" stop-color="#3d90f0" stop-opacity="0"/></radialGradient>
    <radialGradient id="cast" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#221f1a" stop-opacity=".24"/><stop offset=".62" stop-color="#221f1a" stop-opacity=".08"/><stop offset="1" stop-color="#221f1a" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- Apple 的 macOS 图标网格：1024 画布里圆角矩形占 824，四周留透明边 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <ellipse cx="345" cy="464" rx="60" ry="24" fill="url(#cast)"/>
  <ellipse cx="542" cy="464" rx="162" ry="24" fill="url(#cast)"/>
  <ellipse cx="512" cy="560" rx="210" ry="24" fill="url(#cast)"/>
  <ellipse cx="452" cy="656" rx="152" ry="24" fill="url(#cast)"/>
  <!-- 行 1：光标停在这一行，所以 markdown 标记显形 -->
  <rect x="316" y="394" width="58" height="58" rx="20" fill="url(#mk)"/>
  <rect x="322" y="400" width="46" height="4" rx="2" fill="#fff" opacity=".4"/>
  <rect x="404" y="394" width="276" height="58" rx="29" fill="url(#ink)"/>
  <rect x="416" y="400" width="252" height="4" rx="2" fill="#fff" opacity=".14"/>
  <!-- 行 2 / 3：光标不在，已是成品，没有标记 -->
  <rect x="316" y="490" width="392" height="58" rx="29" fill="url(#ink)"/>
  <rect x="328" y="496" width="368" height="4" rx="2" fill="#fff" opacity=".14"/>
  <rect x="316" y="586" width="272" height="58" rx="29" fill="url(#ink)"/>
  <rect x="328" y="592" width="248" height="4" rx="2" fill="#fff" opacity=".14"/>
  <!-- 光标 -->
  <ellipse cx="715" cy="423" rx="86" ry="80" fill="url(#halo)"/>
  <ellipse cx="715" cy="474" rx="42" ry="16" fill="url(#cast)"/>
  <rect x="694" y="380" width="42" height="86" rx="21" fill="url(#car)"/>
  <rect x="703" y="391" width="12" height="60" rx="6" fill="#fff" opacity=".5"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
